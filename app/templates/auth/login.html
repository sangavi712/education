{% extends 'base.html' %}

{% block title %}Login - BuddyLearn AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <h2 class="text-center mb-4 font-weight-bold" style="color: #4A90E2;">Welcome Back! 🌟</h2>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control rounded-3" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom btn-lg">Login</button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted">Don't have an account? <a href="/auth/register" style="color: #4A90E2; font-weight: bold; text-decoration: none;">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
